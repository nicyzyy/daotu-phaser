<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="screen-orientation" content="landscape">
<title>道途 — 与天争命</title>
<link rel="stylesheet" href="style.css?v=46">
<style>
#webview-gate { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#0a0a1a; z-index:999999; color:#dcc07a; text-align:center; font-family:sans-serif; flex-direction:column; align-items:center; justify-content:center; padding:30px; }
#webview-gate h2 { font-size:28px; margin-bottom:12px; }
#webview-gate .subtitle { color:#aaa; font-size:14px; margin-bottom:40px; }
#webview-gate .open-btn { display:inline-block; padding:18px 40px; background:linear-gradient(135deg,#c9a84c,#8b6914); color:#fff; text-decoration:none; border-radius:14px; font-size:20px; font-weight:bold; box-shadow:0 4px 20px rgba(201,168,76,0.4); }
#webview-gate .steps { color:#888; font-size:13px; margin-top:30px; line-height:2; }
#webview-gate .copy-btn { display:inline-block; margin-top:15px; padding:10px 24px; background:rgba(255,255,255,0.1); border:1px solid rgba(201,168,76,0.3); border-radius:8px; color:#dcc07a; font-size:14px; cursor:pointer; }
</style>
<script>
// 检测 WebView / 内嵌浏览器
(function() {
  var ua = navigator.userAgent || '';
  var isWebView = /\b(FBAN|FBAV|Instagram|Discord|Line|WeChat|MicroMessenger|QQ|Snapchat)\b/i.test(ua)
    || (/wv\)/.test(ua) && /Android/.test(ua));  // Android WebView only
  
  if (isWebView) {
    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('webview-gate').style.display = 'flex';
      document.getElementById('game-wrapper').style.display = 'none';
    });
    // 不加载 Phaser！
    window._skipPhaser = true;
  }
})();

// 全局错误捕获
window.onerror = function(msg, url, line) {
  var el = document.getElementById('webview-gate');
  if (el) { el.style.display = 'flex'; }
  return false;
};
</script>
<script>
// 动态加载 Phaser（仅非 WebView）
if (!window._skipPhaser) {
  document.write('<scr'+'ipt src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"><\/scr'+'ipt>');
}
</script>
</head>
<body>
<!-- WebView 引导页 -->
<div id="webview-gate">
  <h2>⚔️ 道途</h2>
  <div class="subtitle">与天争命</div>
  <p style="color:#ff9;margin-bottom:20px;">⚠️ 当前为内嵌浏览器，无法运行游戏</p>
  <a class="open-btn" href="x-safari-https://nicyzyy.github.io/daotu-phaser/?v=46" id="safari-link">🌐 在 Safari 中打开</a>
  <div class="steps">
    或：点右下角 ··· → 「在浏览器中打开」<br>
    或：复制下方链接到 Chrome / Safari
  </div>
  <button class="copy-btn" onclick="navigator.clipboard.writeText('https://nicyzyy.github.io/daotu-phaser/?v=46').then(function(){this.textContent='✅ 已复制！'}.bind(this))">📋 复制链接</button>
  <script>
    // iOS: x-safari-https 可直接跳转 Safari
    // Android: intent:// 跳转默认浏览器
    if (/Android/i.test(navigator.userAgent)) {
      document.getElementById('safari-link').href = 'intent://nicyzyy.github.io/daotu-phaser/?v=46#Intent;scheme=https;end';
      document.getElementById('safari-link').textContent = '🌐 在浏览器中打开';
    }
  </script>
</div>
<div id="game-wrapper">
  <div id="game-container"></div>
  <!-- UI Overlay — sits inside wrapper, scaled to match canvas -->
  <div id="ui-overlay">

    <!-- ATB Bar -->
    <div id="atb-bar">
      <div id="atb-track"></div>
      <div id="atb-ready-line"></div>
    </div>

    <!-- Battle Log -->
    <div id="battle-log">
      <div id="log-content"></div>
    </div>

    <!-- Side HP Panels (已移除，HP 移到头顶) -->
    <div id="ally-panel" class="side-panel left"></div>
    <div id="enemy-panel" class="side-panel right"></div>

    <!-- Action Panel -->
    <div id="action-panel" class="hidden">
      <div class="panel-header">
        <img id="action-portrait" src="" alt="">
        <span id="action-unit-name"></span>
      </div>
      <div id="action-buttons"></div>
    </div>

    <!-- Target Panel -->
    <div id="target-panel" class="hidden">
      <div class="panel-title">选择目标</div>
      <div id="target-buttons"></div>
      <button class="btn-cancel" onclick="window.game_cancelTarget()">取消</button>
    </div>

    <!-- Result Panel -->
    <div id="result-panel" class="hidden">
      <div id="result-text"></div>
      <button id="result-btn" onclick="window.game_restart()">再战一局</button>
    </div>

  </div>
</div>

<!-- 竖屏提示 -->
<div id="rotate-hint">
  <div class="rotate-icon">📱↔️</div>
  <div class="rotate-text">请横屏游戏</div>
  <div class="rotate-sub">Please rotate your device</div>
</div>

<!-- 移动端全屏按钮 -->
<button id="fullscreen-btn" onclick="toggleFullscreen()">⛶</button>

<script src="game.js?v=46"></script>
<script>
function toggleFullscreen() {
  const el = document.documentElement;
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen).call(el);
    try { screen.orientation.lock('landscape').catch(()=>{}); } catch(e){}
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen).call(document);
  }
}
// 首次触摸时自动全屏（移动端）
let firstTouch = true;
document.addEventListener('touchstart', function() {
  if (firstTouch && /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) {
    firstTouch = false;
    toggleFullscreen();
  }
}, { once: true });
</script>
</body>
</html>
