<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="screen-orientation" content="landscape">
<title>道途 — 与天争命</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<link rel="stylesheet" href="style.css?v=37">
</head>
<body>
<div id="game-wrapper">
  <div id="game-container"></div>
  <!-- UI Overlay — sits inside wrapper, scaled to match canvas -->
  <div id="ui-overlay">

    <!-- ATB Bar -->
    <div id="atb-bar">
      <div id="atb-track"></div>
      <div id="atb-ready-line"></div>
    </div>

    <!-- Battle Log -->
    <div id="battle-log">
      <div id="log-content"></div>
    </div>

    <!-- Side HP Panels (已移除，HP 移到头顶) -->
    <div id="ally-panel" class="side-panel left"></div>
    <div id="enemy-panel" class="side-panel right"></div>

    <!-- Action Panel -->
    <div id="action-panel" class="hidden">
      <div class="panel-header">
        <img id="action-portrait" src="" alt="">
        <span id="action-unit-name"></span>
      </div>
      <div id="action-buttons"></div>
    </div>

    <!-- Target Panel -->
    <div id="target-panel" class="hidden">
      <div class="panel-title">选择目标</div>
      <div id="target-buttons"></div>
      <button class="btn-cancel" onclick="window.game_cancelTarget()">取消</button>
    </div>

    <!-- Result Panel -->
    <div id="result-panel" class="hidden">
      <div id="result-text"></div>
      <button id="result-btn" onclick="window.game_restart()">再战一局</button>
    </div>

  </div>
</div>

<!-- 竖屏提示 -->
<div id="rotate-hint">
  <div class="rotate-icon">📱↔️</div>
  <div class="rotate-text">请横屏游戏</div>
  <div class="rotate-sub">Please rotate your device</div>
</div>

<!-- 移动端全屏按钮 -->
<button id="fullscreen-btn" onclick="toggleFullscreen()">⛶</button>

<script src="game.js?v=37"></script>
<script>
function toggleFullscreen() {
  const el = document.documentElement;
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen).call(el);
    try { screen.orientation.lock('landscape').catch(()=>{}); } catch(e){}
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen).call(document);
  }
}
// 首次触摸时自动全屏（移动端）
let firstTouch = true;
document.addEventListener('touchstart', function() {
  if (firstTouch && /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) {
    firstTouch = false;
    toggleFullscreen();
  }
}, { once: true });
</script>
</body>
</html>
